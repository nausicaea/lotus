[package]
name = "lotus"
description = "Lotus Logstash Test Runner"
authors = ["Eleanor Young <developer@nausicaea.net>"]
version = "0.4.5"
edition = "2024"
readme = "README.md"
license = "MIT OR Apache-2.0"

[lib]
name = "lotus"
path = "src/lib.rs"

[[bin]]
name = "lotus"
path = "src/main.rs"

[dependencies]
tempfile = "=3.27.0"
anyhow = "=1.0.104"
assert-json-diff = "=2.0.2"
axum = "=0.8.9"
bollard = "=0.21.0"
clap = { version = "=4.6.6", features = ["derive", "env"] }
directories = "=6.0.0"
futures-util = "=0.3.33"
handlebars = { version = "=6.4.3", features = ["rust-embed"] }
reqwest = { version = "=0.13.4", features = ["json"] }
rust-embed = "=8.12.0"
serde = "=1.0.229"
serde_json = "=1.0.151"
tar = "=0.4.46"
tokio = { version = "=1.53.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
test-log = { version = "=0.2.21", features = ["trace"] }
